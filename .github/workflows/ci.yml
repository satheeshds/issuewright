name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/issuewright-linux-amd64 ./cmd/issuewright
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/issuewright-linux-arm64 ./cmd/issuewright
