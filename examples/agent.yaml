# A reference profile for a polyglot monorepo: a Go API, a TypeScript web UI,
# and a Flutter app sharing a database schema and an OpenAPI contract.
#
# Copy to .agent/agent.yaml and delete what you do not need. Every field is
# optional; `issuewright init` generates the same shape from what it finds.
version: 1

issue:
  # assignee: assignment to the bot starts work.
  # label:    the force_label alone starts work (use when the App bot cannot be
  #           assigned — GitHub answers "Bot does not have access to the repository").
  pickup: assignee            # assignee | label
  force_label: agent:go       # labelling an issue also starts work
  in_progress_label: agent:in-progress
  blocked_label: agent:blocked
  done_label: agent:done

branch_prefix: agent/
base_branch: main

checks:
  - name: go
    paths: ["services/api/**/*.go", "services/api/go.mod", "services/api/go.sum"]
    run:
      - cd services/api && go test ./... && go build ./...

  # Codegen is both a verification step and a drift gate: the generator may
  # rewrite these paths, hands may not.
  - name: codegen
    paths:
      - services/api/queries/**
      - services/api/handlers/**
      - services/api/internal/*/handler.go
      - db/schema.sql
    run:
      - make generate
    drift:
      - services/api/db/**
      - contracts/openapi.yaml
      - contracts/generated/**

  - name: web
    paths: ["web/**"]
    run:
      - cd web && npm ci && npm run build && npm test

  - name: mobile
    paths: ["mobile/**/*.dart", "mobile/pubspec.yaml", "generated/**"]
    run:
      - cd mobile && flutter pub get && flutter analyze && flutter test

protect:
  # Never hand-edited; regenerate instead.
  write_denylist:
    - services/api/db/**
    - contracts/openapi.yaml
    - contracts/generated/**
  # Data-destroying or environment-touching commands, checked against the run log.
  never_run:
    - make db-migrate        # a runner has no database
    - make db-push
    - psql
  secret_paths: [".env", ".env.*"]
  # Templates look like secrets but are documentation: editing them is the point.
  secret_except: ["**/*.example", "**/*.sample", "**/*.template"]

prompt:
  preamble_file: .agent/rules.md
  notes:
    - "Schema change: a human must run the migration before merge."

brain:
  name: pi
  model: ""                    # "" = the fleet default
  thinking: high

# A label on a single issue can override the above for that run:
#   model:provider/strong      thinking:low      brain:opencode
labels:
  override: true
  model_prefix: "model:"
  thinking_prefix: "thinking:"
  brain_prefix: "brain:"

workflows:
  implement:
    enabled: true
    pickup: assignee
  review:
    enabled: true
    on: [pr_opened, comment_mention]
    prompt: .agent/review.md   # optional: a different preamble for reviews
  fix-ci:
    enabled: false             # Phase 2: the engine ships, the workflow does not
